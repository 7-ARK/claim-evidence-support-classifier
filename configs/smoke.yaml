# Short run for a CPU. 32 train rows, 1 epoch. Proves the pipeline only.
# Scores from this config are not a quality claim.

model_name: microsoft/deberta-v3-base
seed: 42
max_length: 256
batch_size: 4
eval_batch_size: 8
grad_accum: 1
epochs: 1
learning_rate: 0.0002
weight_decay: 0.01
warmup_ratio: 0.0
baseline_head_epochs: 1
baseline_head_lr: 0.001
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
target_modules:
  - query_proj
  - value_proj
fp16: false
max_train_samples: 32
max_eval_samples: 32
train_file: data/train.jsonl
val_file: data/val.jsonl
test_file: data/test.jsonl
output_dir: outputs/smoke
adapter_dir: adapters/lora
logging_steps: 1
run_name: smoke
